name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Publish third-party licenses
        run: |
          out=dist/json-formatter/browser/3rdpartylicenses.txt
          cp dist/json-formatter/3rdpartylicenses.txt "$out"
          # Fonts come in via CSS, so the build doesn't collect their license.
          printf '\n%s\nPackage: @fontsource/ubuntu-mono (Ubuntu Mono font files)\nLicense: Ubuntu Font Licence 1.0\n\n' "$(printf -- '-%.0s' {1..80})" >> "$out"
          cat node_modules/@fontsource/ubuntu-mono/LICENSE >> "$out"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/json-formatter/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
